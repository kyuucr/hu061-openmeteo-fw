# Pinned build setup for arduino-cli (`arduino-cli compile --profile hu061`).
# The Arduino IDE ignores this file; the README lists the same settings for the IDE menus.
profiles:
  hu061:
    notes: HU-061 weather clock (ESP-01S, 1 MB flash, no filesystem so OTA updates fit)
    fqbn: esp8266:esp8266:generic:eesz=1M,FlashMode=qio,FlashFreq=40,ResetMethod=ck,baud=115200
    platforms:
      - platform: esp8266:esp8266 (3.1.2)
        platform_index_url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    libraries:
      - WiFiManager (2.0.17)
      - ArduinoJson (7.4.1)
      - ESP8266 and ESP32 OLED driver for SSD1306 displays (4.6.1)
default_profile: hu061
