; HU-061 weather clock: Open-Meteo firmware (no account / API key needed).
; The source is an Arduino sketch folder, so the same files also build in the Arduino IDE.
[platformio]
src_dir = hu061_weather_clock

[env:hu061]
platform = espressif8266@4.2.1          ; Arduino ESP8266 core 3.1.2
board = esp01_1m
framework = arduino
; 1 MB flash with no filesystem: leaves room for over-the-air updates (gzip images)
board_build.ldscript = eagle.flash.1m.ld
board_build.flash_mode = qio
board_build.f_flash = 40000000L
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.4.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
